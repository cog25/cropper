<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Cropper — 스캔 PDF 여백 자르기</title>

  <link data-trunk rel="rust" data-bin="cropper" data-wasm-opt="s" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <link data-trunk rel="copy-file" href="_headers" />
  <base data-trunk-public-url />

  <style>
    html { touch-action: manipulation; }
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #1b1b1b; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center;
               color: #aaa; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="cropper_canvas"></canvas>
  <div id="loading">불러오는 중…</div>
  <script>
    // Open an exported PDF in `win` under a readable service-worker URL;
    // falls back to the plain blob URL if the worker is unavailable.
    window.cropperOpenPdf = async (bytes, name, win, blobUrl) => {
      try {
        const reg = await Promise.race([
          navigator.serviceWorker.ready,
          new Promise((_, rej) => setTimeout(() => rej("sw timeout"), 3000)),
        ]);
        const id = crypto.randomUUID();
        const url = new URL(`_pdf/${id}/${encodeURIComponent(name)}`, reg.scope).href;
        await new Promise((resolve, reject) => {
          const ch = new MessageChannel();
          ch.port1.onmessage = (e) => (e.data === "ok" ? resolve() : reject("sw error"));
          setTimeout(() => reject("ack timeout"), 5000);
          const copy = bytes.slice().buffer;
          reg.active.postMessage({ url, bytes: copy }, [ch.port2, copy]);
        });
        if (win && !win.closed) win.location.href = url; else window.open(url, "_blank");
      } catch (e) {
        if (win && !win.closed) win.location.href = blobUrl; else window.open(blobUrl, "_blank");
      }
    };
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
