[package]
name = "cropper-core"
version = "0.1.0"
edition = "2021"
description = "Client-side scanned-PDF margin cropping, powered by krilla + hayro"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cropper-cli"
path = "src/bin/cli.rs"

[dependencies]
krilla = { version = "0.8.2", default-features = false, features = ["pdf"] }
hayro = { version = "0.7.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"
png = "0.18"
